# Builds the guidance document with MkDocs and publishes it on GitHub Pages.
# Every change on the main branch is published automatically.

name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  # Allows a manual run from the Actions tab
  workflow_dispatch:

# Each action is pinned to an exact, reviewed commit, so a changed tag upstream cannot change
# what runs here. The token can only read the repository and publish the site.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one publication at a time; a running publication is never cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # requirements.txt pins every package, so the build always uses the tested versions.
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      # mkdocs.yml sets strict: true, so a broken internal link or a missing nav
      # file fails the build here instead of being published.
      - name: Build site
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
